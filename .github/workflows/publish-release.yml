name: Publish GisCore Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SpatialViewer.GisCore.sln
      - run: dotnet build SpatialViewer.GisCore.sln -c Release --no-restore
      - run: dotnet test SpatialViewer.GisCore.sln -c Release --no-build --verbosity normal
      - name: Pack libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/packages | Out-Null
          dotnet pack src/SpatialViewer.Gis.Core/SpatialViewer.Gis.Core.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/SpatialViewer.Formats.Gis/SpatialViewer.Formats.Gis.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/SpatialViewer.Formats.Gis.GeoJson/SpatialViewer.Formats.Gis.GeoJson.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/SpatialViewer.Gis.Rendering/SpatialViewer.Gis.Rendering.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/SpatialViewer.Gis.Rendering.Windows/SpatialViewer.Gis.Rendering.Windows.csproj -c Release --no-build -o artifacts/packages
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/packages/* --generate-notes --title "SpatialViewer.GisCore ${{ github.ref_name }}"
